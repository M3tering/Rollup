name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FOUNDRY_PROFILE: ci

jobs:
  check:
    name: Build, behavior, and stateful invariants
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Install pinned Foundry
        uses: foundry-rs/foundry-toolchain@v1.9.1
        with:
          version: v1.8.1

      - name: Install locked dependencies
        run: |
          forge --version
          forge soldeer install
          git diff --exit-code -- foundry.toml soldeer.lock

      - name: Check formatting
        run: forge fmt --check

      - name: Build and check production size
        run: forge build --sizes

      - name: Run behavioral, fuzz, and invariant tests
        run: forge test -vvv --gas-report
